apiVersion: v1
kind: Pod
metadata:
  name: my-postgres-postgresql-0
  namespace: default
  labels:
    app.kubernetes.io/component: primary        
    app.kubernetes.io/instance: my-postgres     
    app.kubernetes.io/name: postgresql          
spec:
  containers:
  - name: postgres
    image: postgres:16
    env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        value: P!st0n2024#Db
      - name: POSTGRES_DB
        value: piston
      - name: PGDATA
        value: /var/lib/postgresql/data/pgdata
    ports:
      - name: tcp-postgresql                   
        containerPort: 5432
        protocol: TCP
    volumeMounts:
      - name: data
        mountPath: /var/lib/postgresql/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-my-postgres-postgresql
